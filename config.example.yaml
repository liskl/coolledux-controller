ble:
  device_name: "CoolLEDUX"

  # Single-device legacy knob. If `devices` below is empty and this is
  # set, the service registers this one MAC. Prefer `devices` for new
  # configs.
  device_mac: "01:00:00:FB:A4:16"

  # Multi-device list. Each entry gets its own registry ID (normalized
  # MAC) and its own set of REST/MQTT routes. Comment out when you want
  # scan-on-startup to auto-populate instead.
  # devices:
  #   - name: "kitchen"
  #     mac: "01:00:00:FB:A4:16"
  #   - name: "garage"
  #     mac: "01:00:00:9E:3E:75"

  # MACs in this list are never added to the registry — not from the
  # `devices` list above, not from scan-on-startup, not from a manual
  # POST /scan. Use to keep the service from driving a neighbour's
  # sign, or a panel you've pulled from the fleet. Comparison ignores
  # case and colons, so "01:00:00:9E:3E:75", "01:00:00:9e:3e:75", and
  # "0100009e3e75" all match.
  # exclude_macs:
  #   - "01:00:00:9E:3E:75"

  # Pointer-semantics: explicit true forces scan-on-startup, explicit
  # false disables it; omit for the default (scan when no devices are
  # configured, skip otherwise).
  # scan_on_startup: true

  service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
  char_uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
  device_service_uuid: "9056aa8d-24a1-427e-ae91-b70e0bf992cd"
  scan_timeout: "10s"
  reconnect_interval: "5s"

display:
  columns: 96
  rows: 16
  default_brightness: 128
  default_font_size: 16
  default_color: "#FFFFFF"
  default_speed: 5

mqtt:
  broker: "tcp://localhost:1883"
  client_id: "coolledux-controller"
  username: ""
  password: ""
  topic_prefix: "coolledux"
  ha_discovery_prefix: "homeassistant"
  keepalive: "30s"

api:
  listen: ":8080"
  cors_origins:
    - "*"

log:
  level: "info"     # debug, info, warn, error
  format: "json"    # json, text
